<main class="login-page"><div class="login-backdrop"></div><section class="login-brand"><img src="max-fit-logo.png" alt="Max Fit" class="login-logo" /><p class="eyebrow">SISTEMA DE GESTIÓN</p><p class="login-slogan">DISCIPLINA <span>•</span> PERSONAS <span>•</span> RESULTADOS</p></section><form class="login-card" (ngSubmit)="submit.emit({email, password})"><div class="brand-mini"><span class="brand-mark">MF</span><span>MAX <b>FIT</b></span></div><h1>Iniciar sesión</h1><p class="muted">Ingresa a tu cuenta de Max Fit</p><app-floating-input label="Usuario o correo" name="email" [(ngModel)]="email" type="email"></app-floating-input><app-floating-input label="Contraseña" name="password" [(ngModel)]="password" type="password"></app-floating-input><div class="login-options"><label class="check"><input type="checkbox" /> <span>Recordar sesión</span></label><button type="button" class="link-button" (click)="forgot.emit()">¿Olvidaste tu contraseña?</button></div>@if (error) { <p class="error-text">{{ error }}</p> }<button class="primary-button full" type="submit">Iniciar sesión <span>→</span></button><div class="demo-access"><small>Acceso demo</small><div><button type="button" (click)="fill('propietario@maxfit.test','Owner123')">DUEÑO</button><button type="button" (click)="fill('admin@maxfit.test','Admin123')">ADMI</button><button type="button" (click)="fill('operador@maxfit.test','Operador123')">OPERADOR</button><button type="button" (click)="fill('asesor@maxfit.test','Asesor123')">ASESOR</button><button type="button" (click)="fill('usuario@maxfit.test','Usuario123')">USUARIO</button></div></div></form></main>
