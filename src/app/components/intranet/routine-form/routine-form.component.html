<section class="inline-form-shell"><div class="inline-form-head"><div><p class="eyebrow orange">NUEVO EJERCICIO</p><h2>Agregar a rutina</h2></div><button class="close-button" type="button" (click)="cancel.emit()">×</button></div><div class="inline-form-grid"><app-floating-input label="Ejercicio" [(ngModel)]="exercise" placeholder="Ej. Press militar"></app-floating-input><app-floating-input label="Máquina" [(ngModel)]="machine" placeholder="Ej. Shoulder press"></app-floating-input><app-floating-input label="Series y repeticiones" [(ngModel)]="sets"></app-floating-input><app-floating-input label="Carga inicial" [(ngModel)]="load"></app-floating-input></div><div class="inline-form-actions"><button class="secondary-button" type="button" (click)="cancel.emit()">Cancelar</button><button class="primary-button" type="button" (click)="save.emit({exercise, machine, sets, load})">Agregar ejercicio</button></div></section>
