<section class="inline-form-shell"><div class="inline-form-head"><div><p class="eyebrow orange">NUEVO PLAN DE RUTINA</p><h2>Crear rutina</h2><p class="muted">Una rutina agrupa varios ejercicios para asignarlos como plan.</p></div><button class="close-button" type="button" (click)="cancel.emit()">×</button></div><div class="inline-form-grid"><app-floating-input label="Nombre de la rutina" [(ngModel)]="name" placeholder="Ej. Fuerza e hipertrofia"></app-floating-input><app-floating-select label="Objetivo" [(ngModel)]="focus"><option>Fuerza e hipertrofia</option><option>Pérdida de grasa</option><option>Tren superior</option><option>Tren inferior</option><option>Movilidad y core</option></app-floating-select><app-floating-select label="Duración" [(ngModel)]="duration"><option>4 semanas</option><option>6 semanas</option><option>8 semanas</option><option>12 semanas</option></app-floating-select><app-floating-textarea class="form-span-2" label="Ejercicios incluidos" [(ngModel)]="exercises" [rows]="4" placeholder="Prensa inclinada, Press de pecho, Jalón al pecho"></app-floating-textarea><small class="form-help">Separa los ejercicios con comas. Luego podrás asignar cargas desde el catálogo.</small></div><div class="inline-form-actions"><button class="secondary-button" type="button" (click)="cancel.emit()">Cancelar</button><button class="primary-button" type="button" (click)="save.emit({name, focus, duration, exercises})">Guardar plan de rutina</button></div></section>
