<section class="inline-form-shell"><div class="inline-form-head"><div><p class="eyebrow orange">SEGUIMIENTO PERSONAL</p><h2>Registrar medición</h2><p class="muted">Guarda tu peso y medidas de hoy.</p></div><button class="close-button" type="button" (click)="cancel.emit()">×</button></div><div class="measurement-form-grid"><app-floating-input label="Fecha" [(ngModel)]="date"></app-floating-input><app-floating-input label="Peso (kg)" type="number" step="0.1" [(ngModel)]="weight"></app-floating-input><app-floating-input label="Cintura (cm)" type="number" [(ngModel)]="waist"></app-floating-input><app-floating-input label="Pecho (cm)" type="number" [(ngModel)]="chest"></app-floating-input><app-floating-input label="Brazo (cm)" type="number" [(ngModel)]="arm"></app-floating-input><app-floating-input label="Pierna (cm)" type="number" [(ngModel)]="leg"></app-floating-input></div><div class="inline-form-actions"><button class="secondary-button" type="button" (click)="cancel.emit()">Cancelar</button><button class="primary-button" type="button" (click)="save.emit({date, weight, waist, chest, arm, leg})">Guardar peso y medidas</button></div></section>
