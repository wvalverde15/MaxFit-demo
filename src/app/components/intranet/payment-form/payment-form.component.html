<section class="inline-form-shell"><div class="inline-form-head"><div><p class="eyebrow orange">NUEVO MOVIMIENTO</p><h2>Registrar pago</h2></div><button class="close-button" type="button" (click)="cancel.emit()">×</button></div><div class="inline-form-grid"><app-floating-select label="Cliente" [(ngModel)]="client"><option>Jorge Medina</option><option>Valeria Sánchez</option><option>Luis Villanueva</option></app-floating-select><app-floating-input label="Importe" type="number" [(ngModel)]="amount"></app-floating-input><app-floating-select label="Medio de pago" [(ngModel)]="method"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Tarjeta</option></app-floating-select></div><div class="inline-form-actions"><button class="secondary-button" type="button" (click)="cancel.emit()">Cancelar</button><button class="primary-button" type="button" (click)="save.emit({client, amount, method})">Confirmar pago · S/ {{ amount }}</button></div></section>
