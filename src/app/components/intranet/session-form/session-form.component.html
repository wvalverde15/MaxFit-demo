<section class="inline-form-shell"><div class="inline-form-head"><div><p class="eyebrow orange">SESIÓN DE HOY</p><h2>Registrar entrenamiento</h2><p class="muted">Completa el resumen real de tu sesión.</p></div><button class="close-button" type="button" (click)="cancel.emit()">×</button></div><div class="inline-form-grid"><app-floating-input label="Duración (minutos)" type="number" [(ngModel)]="duration"></app-floating-input><app-floating-input label="Rutina" [(ngModel)]="routine"></app-floating-input><app-floating-input label="Ejercicios completados" type="number" [(ngModel)]="completed"></app-floating-input><app-floating-input label="Series realizadas" type="number" [(ngModel)]="sets"></app-floating-input><app-floating-input label="Repeticiones totales" type="number" [(ngModel)]="repetitions"></app-floating-input><app-floating-input label="Carga total (kg)" type="number" step="0.5" [(ngModel)]="totalLoad"></app-floating-input><app-floating-input label="Descanso promedio (seg)" type="number" [(ngModel)]="restSeconds"></app-floating-input><app-floating-input label="Esfuerzo (1 a 10)" type="number" min="1" max="10" [(ngModel)]="effort"></app-floating-input><app-floating-textarea class="form-span-2" label="Notas" [(ngModel)]="notes" [rows]="3" placeholder="¿Cómo te sentiste? ¿Alguna molestia?"></app-floating-textarea></div><div class="inline-form-actions"><button class="secondary-button" type="button" (click)="cancel.emit()">Cancelar</button><button class="primary-button" type="button" [disabled]="!valid" (click)="save.emit({duration, routine, completed, sets, repetitions, totalLoad, restSeconds, effort, notes})">Guardar sesión</button></div></section>
